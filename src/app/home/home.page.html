<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Buscar produto..."
      [value]="buscaQuery"
      (ionInput)="buscaQuery = $any($event).target.value"
      (keyup.enter)="buscar()"
      showCancelButton="never"
      debounce="0">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="false">
  <h1 class="sr-only">ARCA — Comparador de Preços</h1>
  <div class="home-container">

    <!-- COMO USAR - 3 passos -->
    <section class="como-usar">
      <h2 class="secao-titulo">Como funciona</h2>
      <div class="passos-grid">
        <div class="passo" *ngFor="let p of passos; let i = index">
          <div class="passo-numero">{{ i + 1 }}</div>
          <ion-icon [name]="p.icone" class="passo-icone"></ion-icon>
          <strong>{{ p.titulo }}</strong>
          <span>{{ p.descricao }}</span>
        </div>
      </div>
    </section>

    <!-- AÇÕES RÁPIDAS -->
    <section class="acoes-rapidas">
      <button class="acao-btn" (click)="irPara('/pesquisar-produtos')">
        <ion-icon name="search"></ion-icon>
        <span>Buscar Produtos</span>
      </button>
      <button class="acao-btn" (click)="irPara('/comparar')">
        <ion-icon name="swap-horizontal"></ion-icon>
        <span>Comparar</span>
      </button>
      <button class="acao-btn" (click)="irPara('/lista-rapida')">
        <ion-icon name="list"></ion-icon>
        <span>Lista Rápida</span>
      </button>
      <button class="acao-btn" (click)="irPara('/mercados-proximos')">
        <ion-icon name="cart"></ion-icon>
        <span>Mercados</span>
      </button>
    </section>

    <!-- HISTÓRICO RECENTE -->
    <section class="historico-secao" *ngIf="historico.length > 0">
      <div class="secao-header">
        <h2 class="secao-titulo">
          <ion-icon name="time"></ion-icon>
          Atividade Recente
        </h2>
        <button class="ver-todas" (click)="irPara('/historico')">
          Ver todas <ion-icon name="chevron-forward"></ion-icon>
        </button>
      </div>
      <div class="historico-lista">
        <div class="historico-item" *ngFor="let item of historico" (click)="item.rota && irPara(item.rota)">
          <span class="historico-icone">{{ item.icone }}</span>
          <div class="historico-info">
            <span class="historico-desc">{{ item.descricao }}</span>
            <span class="historico-detalhe" *ngIf="item.detalhe">{{ item.detalhe }}</span>
          </div>
          <span class="historico-tempo">{{ formatarData(item.data) }}</span>
        </div>
      </div>
    </section>

  </div>
</ion-content>

<app-footer></app-footer>
<app-modal-carrinho></app-modal-carrinho>
