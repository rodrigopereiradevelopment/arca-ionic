<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-searchbar
      placeholder="Categoria / Produto"
      showCancelButton="never"
      (keyup.enter)="buscar($event)">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="false">
  <h1 class="sr-only">ARCA — Comparador de Preços</h1>
  <div class="home-container">
    
<!--Trocar os baners por encartes de oferta reais-->
    <swiper-container loop="true" autoplay="true" pagination="true"
      slides-per-view="2" space-between="8" class="banner-top"
      breakpoints='{"768": {"slidesPerView": 3}, "1024": {"slidesPerView": 4}}'>
      <swiper-slide><img src="assets/img/Compare1.png" alt="Comparação de preços entre mercados"></swiper-slide>
      <swiper-slide><img src="assets/img/Compare.png" alt="Encontre o menor preço perto de você"></swiper-slide>
      <swiper-slide><img src="assets/img/Descontos.png" alt="Descontos e ofertas especiais"></swiper-slide>
      <swiper-slide><img src="assets/img/Descubra.png" alt="Descubra novos produtos e marcas"></swiper-slide>
      <swiper-slide><img src="assets/img/Economia.png" alt="Economize nas suas compras do dia a dia"></swiper-slide>
      <swiper-slide><img src="assets/img/Ofertas.png" alt="Ofertas imperdíveis dessa semana"></swiper-slide>
    </swiper-container>

    <swiper-container loop="true" autoplay="true" pagination="true"
      slides-per-view="1.05" space-between="12" class="banner-promo"
      breakpoints='{"768": {"slidesPerView": 2}, "1024": {"slidesPerView": 2.5}}'>
      <swiper-slide><img src="assets/img/Promocao3.png" alt="Promoção de carnes e frangos"></swiper-slide>
      <swiper-slide><img src="assets/img/Promocao1.png" alt="Promoção de bebidas e refrigerantes"></swiper-slide>
      <swiper-slide><img src="assets/img/Promocao.png" alt="Promoção de mercearia e grãos"></swiper-slide>
      <swiper-slide><img src="assets/img/Promocao2.png" alt="Promoção de higiene e limpeza"></swiper-slide>
    </swiper-container>

  </div>
</ion-content>

<app-footer></app-footer>
<app-modal-carrinho></app-modal-carrinho>
