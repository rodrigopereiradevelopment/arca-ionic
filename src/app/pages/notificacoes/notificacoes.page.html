<ion-content [fullscreen]="true">

  <div class="topo">
    <a routerLink="/home" class="btn-voltar" aria-label="Voltar">&#8592;</a>
    <img src="assets/img/logo.png" class="logo" alt="ARCA Logo">
    <button class="btn-limpar" (click)="confirmarLimpar()" aria-label="Excluir todas">🗑️</button>
  </div>

  <div class="container">

    <div class="cabecalho-lista">
      <div>
        <h1><span aria-hidden="true">🔔</span> Notificações</h1>
        <p class="subtitulo">
          {{ naoLidas }} não lida(s) · {{ notificacoes.length }} total
        </p>
      </div>
      <button class="btn-marcar-todas" (click)="marcarTodasLidas()"
        *ngIf="naoLidas > 0">
        ✅ Marcar todas
      </button>
    </div>

    <!-- FILTROS -->
    <div class="filtros">
      <button [class.ativo]="filtroAtivo === 'todas'"
        (click)="filtroAtivo = 'todas'">Todas</button>
      <button [class.ativo]="filtroAtivo === 'alerta_preco'"
        (click)="filtroAtivo = 'alerta_preco'">💰 Preços</button>
      <button [class.ativo]="filtroAtivo === 'promocao'"
        (click)="filtroAtivo = 'promocao'">🏷️ Promoções</button>
      <button [class.ativo]="filtroAtivo === 'sistema'"
        (click)="filtroAtivo = 'sistema'">📱 Sistema</button>
      <button [class.ativo]="filtroAtivo === 'marketing'"
        (click)="filtroAtivo = 'marketing'">📢 Marketing</button>
    </div>

    <!-- CARREGANDO -->
    <div class="vazio" *ngIf="loading">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Carregando notificações...</p>
    </div>

    <!-- NOTIFICAÇÕES -->
    <div
      class="notif-card"
      *ngFor="let n of notificacoesFiltradas"
      [class.nao-lida]="!n.lida"
      (click)="marcarLida(n)" role="button" tabindex="0">

      <div class="notif-icone" [style.background]="corTipo(n.tipo)">
        {{ iconeTipo(n.tipo) }}
      </div>

      <div class="notif-info">
        <div class="notif-topo">
          <strong>{{ n.titulo }}</strong>
          <span class="tempo">{{ formatarData(n.created_at) }}</span>
        </div>
        <p class="mensagem">{{ n.mensagem }}</p>
      </div>

      <button class="btn-remover"
        (click)="$event.stopPropagation(); remover(n)" aria-label="Fechar">✕</button>

    </div>

    <!-- VAZIO -->
    <div class="vazio" *ngIf="!loading && notificacoesFiltradas.length === 0">
      <span class="vazio-icone"><span aria-hidden="true">🔔</span></span>
      <p>Nenhuma notificação por aqui!</p>
    </div>

  </div>

</ion-content>
