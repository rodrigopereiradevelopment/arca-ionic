<ion-content [fullscreen]="true">
  <div class="topo">
    <img src="assets/img/logo.png" class="logo" alt="ARCA Logo">
  </div>
  <div class="container">
    <h1>Bem-vindo! 👋</h1>
    <p class="subtitulo">Entre na sua conta ARCA</p>

    <div class="form-group">
      <label>E-mail</label>
      <input type="email" [(ngModel)]="email" placeholder="seu@email.com">
    </div>

    <div class="form-group">
      <label>Senha</label>
      <div class="senha-row">
        <input [type]="mostrarSenha ? 'text' : 'password'"
          [(ngModel)]="senha" placeholder="Sua senha">
        <button class="btn-olho" (click)="mostrarSenha = !mostrarSenha"
          [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">
          {{ mostrarSenha ? '🙈' : '👁️' }}
        </button>
      </div>
    </div>

    <button class="btn-entrar" (click)="login()" [disabled]="carregando">
      {{ carregando ? 'Entrando...' : 'Entrar' }}
    </button>

    <a routerLink="/cadastro" class="link-cadastro">
      Não tem conta? <strong>Cadastre-se</strong>
    </a>

    <a routerLink="/esqueci-senha" class="link-esqueci">
      Esqueci minha senha
    </a>

    <div class="divisor">
      <span>ou continue com</span>
    </div>

    <div class="social-btns">
      <button class="btn-social btn-google" (click)="loginGoogle()">
        <img src="assets/img/google.png" alt="Google"> Entrar com Google
      </button>
      <button class="btn-social btn-facebook" (click)="loginFacebook()">
        <img src="assets/img/facebook.png" alt="Facebook"> Entrar com Facebook
      </button>
    </div>

  </div>
</ion-content>
